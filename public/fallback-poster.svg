<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450" preserveAspectRatio="xMidYMid slice" aria-label="电影封面占位">
  <defs>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1726"/>
      <stop offset="100%" style="stop-color:#2d2845"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#3d3660" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="450" fill="url(#paperBg)"/>
  <rect width="300" height="450" fill="url(#dots)"/>

  <!-- 票根虚线框 -->
  <rect x="24" y="24" width="252" height="402" fill="none" stroke="#3d3660" stroke-width="1" stroke-dasharray="4 4" rx="2"/>

  <!-- 中央电影胶片图标 -->
  <g transform="translate(150 200)" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6">
    <rect x="-44" y="-50" width="14" height="100" rx="3" fill="#1a1726"/>
    <rect x="-40" y="-38" width="6" height="10" rx="1" fill="#00f0ff" opacity="0.4"/>
    <rect x="-40" y="-18" width="6" height="10" rx="1" fill="#00f0ff" opacity="0.4"/>
    <rect x="-40" y="2" width="6" height="10" rx="1" fill="#00f0ff" opacity="0.4"/>
    <rect x="-40" y="22" width="6" height="10" rx="1" fill="#00f0ff" opacity="0.4"/>
    <rect x="30" y="-50" width="14" height="100" rx="3" fill="#1a1726"/>
    <rect x="34" y="-38" width="6" height="10" rx="1" fill="#00f0ff" opacity="0.4"/>
    <rect x="34" y="-18" width="6" height="10" rx="1" fill="#00f0ff" opacity="0.4"/>
    <rect x="34" y="2" width="6" height="10" rx="1" fill="#00f0ff" opacity="0.4"/>
    <rect x="34" y="22" width="6" height="10" rx="1" fill="#00f0ff" opacity="0.4"/>
    <polygon points="-12,-18 18,0 -12,18" fill="#ffea00" stroke="none" opacity="0.8"/>
  </g>

  <line x1="60" y1="290" x2="240" y2="290" stroke="#3d3660" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="150" y="318" text-anchor="middle" font-family="'VT323', monospace" font-size="14" fill="#6b5f8e" letter-spacing="2">NO POSTER</text>

  <text x="150" y="60" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="8" fill="#9b8fbf" letter-spacing="1">DAILY MOVIE</text>
</svg>