<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c518"/>
      <stop offset="100%" style="stop-color:#ffd54f"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角方形 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 电影胶片左侧 -->
  <rect x="96" y="128" width="32" height="256" rx="8" fill="#2a2a2a"/>
  <rect x="96" y="160" width="32" height="48" rx="4" fill="#3a3a3a"/>
  <rect x="96" y="232" width="32" height="48" rx="4" fill="#3a3a3a"/>
  <rect x="96" y="304" width="32" height="48" rx="4" fill="#3a3a3a"/>
  <!-- 电影胶片右侧 -->
  <rect x="384" y="128" width="32" height="256" rx="8" fill="#2a2a2a"/>
  <rect x="384" y="160" width="32" height="48" rx="4" fill="#3a3a3a"/>
  <rect x="384" y="232" width="32" height="48" rx="4" fill="#3a3a3a"/>
  <rect x="384" y="304" width="32" height="48" rx="4" fill="#3a3a3a"/>
  <!-- 连接带 -->
  <rect x="128" y="220" width="256" height="72" rx="8" fill="#242424"/>
  <!-- 播放三角形 -->
  <polygon points="220,180 220,330 320,255" fill="url(#gold)"/>
</svg>
