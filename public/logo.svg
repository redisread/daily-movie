<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 32x32 pixel arcade coin logo -->
  <rect width="32" height="32" fill="#0d0b1a"/>
  <!-- Outer frame -->
  <rect x="2" y="2" width="28" height="28" fill="#1e1b2e" stroke="#00f0ff" stroke-width="2"/>
  <!-- Inner play button triangle (pixelated) -->
  <rect x="10" y="9" width="4" height="14" fill="#ffea00"/>
  <rect x="14" y="11" width="4" height="10" fill="#ffea00"/>
  <rect x="18" y="13" width="4" height="6" fill="#ffea00"/>
  <!-- Top/bottom notches -->
  <rect x="14" y="0" width="4" height="3" fill="#0d0b1a"/>
  <rect x="14" y="29" width="4" height="3" fill="#0d0b1a"/>
  <rect x="0" y="14" width="3" height="4" fill="#0d0b1a"/>
  <rect x="29" y="14" width="3" height="4" fill="#0d0b1a"/>
</svg>
